<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Golden Gradient -->
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Inner Glow / Shadow -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base for Mobile & Web App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#goldBg)" />
  <rect width="512" height="512" rx="120" fill="url(#innerGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />

  <!-- The Gift Icon (Centered & Perfectly Proportioned in Deep Brand Maroon #220f18) -->
  <g transform="translate(106, 106) scale(12.5)" filter="url(#shadow)">
    <!-- Box Body -->
    <path
      d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"
      fill="none"
      stroke="#220f18"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Vertical Center Ribbon -->
    <path
      d="M12 8v13"
      fill="none"
      stroke="#220f18"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Box Lid -->
    <rect
      x="3"
      y="8"
      width="18"
      height="4"
      rx="1"
      fill="#220f18"
      stroke="#220f18"
      stroke-width="0.6"
      stroke-linejoin="round"
    />
    <!-- Ribbon Bows -->
    <path
      d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 4.8 0 0 1 12 8a4.8 4.8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"
      fill="none"
      stroke="#220f18"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>